services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currency-app
    ports:
      - "8083:8083"     # Laravel
      - "5173:5173"     # Vite (Vue.js)
    volumes:
      - .:/var/www/html
    networks:
      - laravelnet
    depends_on:
      - redis
      - influxdb

  redis:
    image: redis:alpine
    container_name: laravel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - laravelnet

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb2
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=admin123
      - DOCKER_INFLUXDB_INIT_ORG=currencyOrg
      - DOCKER_INFLUXDB_INIT_BUCKET=currencyBucket
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=eAeADTivXz35rwvrR6yHsJz_DtBYeB6G_mc98Y0YbqGypMjDMyMmyh0h8q5qkaPUyvqDa3PpAJIw2TOme9ywfw==
    networks:
      - laravelnet

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - laravelnet

networks:
  laravelnet:
    driver: bridge

volumes:
  redis-data:
  influxdb-data:
  grafana-data:
